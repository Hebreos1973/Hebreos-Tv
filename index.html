<!-- Cargar Firebase SDKs desde CDN -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tu configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyB55d1iEAZGcGjlpnWMGIU3JAu1CRknkSw",
        authDomain: "hebreostv.firebaseapp.com",
        projectId: "hebreostv",
        storageBucket: "hebreostv.firebasestorage.app",
        messagingSenderId: "150421055844",
        appId: "1:150421055844:web:0fb2884e25bf0b4b80f271",
        measurementId: "G-9L2JEJ1SZ1"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Elementos del DOM
    const loginBtn = document.getElementById('loginBtn');
    const userProfile = document.getElementById('userProfile');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const logoutBtn = document.getElementById('logoutBtn');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');
    const authPrompt = document.getElementById('authPrompt');

    let currentUser = null;

    // Manejar autenticación
    loginBtn.addEventListener('click', async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            console.error("Error al iniciar sesión:", error);
        }
    });

    logoutBtn.addEventListener('click', async () => {
        try {
            await signOut(auth);
        } catch (error) {
            console.error("Error al cerrar sesión:", error);
        }
    });

    // Observar estado del usuario
    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
            loginBtn.classList.add('hidden');
            userProfile.classList.remove('hidden');
            userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
            userName.textContent = user.displayName;
            chatForm.classList.remove('hidden');
            authPrompt.classList.add('hidden');
        } else {
            loginBtn.classList.remove('hidden');
            userProfile.classList.add('hidden');
            chatForm.classList.add('hidden');
            authPrompt.classList.remove('hidden');
        }
    });

    // Enviar mensaje a Firestore
    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text || !currentUser) return;

        try {
            await addDoc(collection(db, "messages"), {
                uid: currentUser.uid,
                name: currentUser.displayName,
                avatar: currentUser.photoURL || 'https://via.placeholder.com/40',
                text: text,
                createdAt: serverTimestamp()
            });
            chatInput.value = '';
        } catch (error) {
            console.error("Error al enviar mensaje:", error);
            alert("No se pudo enviar el mensaje. Asegúrate de tener Firestore configurado.");
        }
    });

    // Cargar mensajes en tiempo real
    const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
    onSnapshot(q, (snapshot) => {
        chatMessages.innerHTML = '';
        snapshot.forEach((doc) => {
            const data = doc.data();
            const div = document.createElement('div');
            div.className = "flex items-start space-x-3 p-2 rounded-lg bg-black/5 dark:bg-white/5";
            
            const time = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Reciente';

            div.innerHTML = `
                <img src="${data.avatar}" class="w-8 h-8 rounded-full object-cover mt-1" alt="Avatar">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-xs text-amber-600 dark:text-amber-400 truncate">${data.name}</span>
                        <span class="text-[10px] text-gray-400">${time}</span>
                    </div>
                    <p class="text-sm text-gray-700 dark:text-gray-300 break-words mt-0.5">${escapeHtml(data.text)}</p>
                </div>
            `;
            chatMessages.appendChild(div);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }
</script>
